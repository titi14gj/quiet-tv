<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>静境 TV · 设计预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible{outline:2px solid #ffffffb0;outline-offset:5px}button:focus{z-index:5}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#020205;isolation:isolate;--tone:244,63,139;container-type:inline-size}.wallpaper,.shade,.ambient{position:absolute;inset:0;pointer-events:none}.wallpaper{background-position:center;background-size:cover;transition:opacity .4s}.ambient{background:radial-gradient(ellipse at 50% 42%,rgba(35,49,130,.25),transparent 52%),radial-gradient(ellipse at 24% 86%,rgba(var(--tone),.16),transparent 45%);transition:background .5s}.shade{background:linear-gradient(180deg,#0003,transparent 25%,transparent 55%,#0008)}.header{position:absolute;inset:5.5% 5.5% auto;display:flex;justify-content:space-between;align-items:flex-start;z-index:8}.clock{font-size:3.35cqw;font-weight:300;line-height:1.1;letter-spacing:-.055em}.date{font-size:1.05cqw;color:#fff9;margin-top:.6cqw}.top-actions{display:flex;gap:1.1cqw;align-items:center}.pill{height:3.6cqw;border-radius:3cqw;padding:0 1.4cqw;background:linear-gradient(#ffffff14,#ffffff07);box-shadow:inset 0 1px 1px #ffffff24,0 8px 24px #0003;color:#e9e9ed;display:flex;align-items:center;gap:.7cqw;font-size:1.06cqw;transition:background .18s,transform .18s}.pill:hover,.pill:focus-visible{background:#ffffff29;transform:scale(1.035)}.pill.icon-only{padding:0;width:3.6cqw;justify-content:center}.symbol{width:1.5cqw;height:1.5cqw;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.home{position:absolute;left:8.5%;right:8.5%;top:65.5%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.8cqw;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .25s}.app{background:transparent;padding:0;position:relative;perspective:800px;text-align:center;min-width:0;outline-offset:12px!important}.art{position:relative;aspect-ratio:1.6;border-radius:1.9cqw;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.2,.9,.2,1.2),box-shadow .38s;box-shadow:0 1.5cqw 2.7cqw #0006;will-change:transform}.crop{position:absolute;inset:0;overflow:hidden;border-radius:inherit;background:#fff}.crop img{position:absolute;max-width:none;pointer-events:none;user-select:none}.art:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,#ffffff25,transparent 43%,#ffffff03);box-shadow:inset 0 1px 1px #ffffff70;opacity:.4;transition:opacity .3s;pointer-events:none}.app.active .art{transform:translateY(-.7cqw) scale(1.09);box-shadow:0 2.6cqw 3.6cqw #0009,0 1.2cqw 3.2cqw var(--glow)}.app.active .art:after{opacity:.9}.app.active{z-index:3}.app:focus-visible{outline:none}.app:focus-visible .art:after{opacity:1}.name{display:block;margin-top:1.6cqw;height:2cqw;font-size:1.5cqw;font-weight:400;letter-spacing:.015em;color:#fff9;transition:color .2s;text-shadow:0 2px 8px #0008;white-space:nowrap}.app.active .name{color:#fff}.grid{position:absolute;inset:31% 8.5% 8%;display:none;grid-template-columns:repeat(4,1fr);gap:3.4cqw 2.8cqw;align-content:start}.expanded .home{transform:translateY(-24cqw);opacity:0;pointer-events:none}.expanded .grid{display:grid}.grid .art{border-radius:1.6cqw}.grid .name{font-size:1.25cqw;margin-top:1cqw}.utility-art{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#484957,#22232d);box-shadow:inset 0 1px 1px #ffffff40}.utility-art .symbol{height:4cqw;width:4cqw;stroke-width:1.2}.overlay{position:absolute;inset:0;z-index:20;background:#0005;backdrop-filter:blur(8px);display:none}.overlay.open{display:block}.menu{position:absolute;right:5.5%;top:14%;width:25%;padding:1cqw;background:linear-gradient(140deg,#30313bf7,#171820fa);border:1px solid #ffffff22;border-radius:1.9cqw;box-shadow:0 2cqw 5cqw #0007}.menu h2{font-size:1.4cqw;font-weight:500;margin:.7cqw 1cqw 1.2cqw;color:#ffffffa0}.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:1.15cqw 1.2cqw;font-size:1.3cqw;border-radius:1cqw;background:transparent;min-height:3.9cqw}.menu button small{font-size:1cqw;color:#fff6}.menu button:hover,.menu button:focus{background:#f3f3f6;color:#17171d;outline:none}.menu button:focus small,.menu button:hover small{color:#555}.panel{position:absolute;inset:20% 8.5% 13%;padding:2.5cqw;border-radius:2cqw;background:#1b1c25f5;border:1px solid #ffffff24;box-shadow:0 3cqw 6cqw #0007}.panel h2{font-size:2cqw;font-weight:400;margin:0 0 2.2cqw}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}.wall-choice{background:none;padding:0;text-align:center;font-size:1.3cqw}.thumb{display:block;aspect-ratio:16/9;border-radius:1cqw;background-size:cover;background-position:center;margin-bottom:1cqw;box-shadow:inset 0 0 0 1px #ffffff20}.wall-choice[aria-pressed=true] .thumb{outline:2px solid #fff;outline-offset:5px}.panel .back{position:absolute;right:2.5cqw;top:2.5cqw;font-size:1.25cqw;background:#ffffff15;padding:.6cqw 1.1cqw;border-radius:2cqw}.toast{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:1.2cqw;padding:1cqw 1.8cqw;border-radius:3cqw;background:#252630f2;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}.preview-note{max-width:1100px;margin:20px auto;padding:0 24px;color:#92949f;font-size:13px;line-height:1.8;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}.preview-note button{padding:6px 12px;background:#22242e;border-radius:8px;color:#ddd}.safe-lines{position:absolute;inset:5%;border:1px dashed #ffffff55;pointer-events:none;z-index:25;display:none}.show-safe .safe-lines{display:block}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}@media(max-width:600px){.preview-note{font-size:12px}}
/* Shared translucent material for top controls and their focused menu rows. */
.art,.grid .art{border-radius:10% / 16%}
.crop{background:transparent;isolation:isolate;transform:translateZ(0);-webkit-mask-image:linear-gradient(#fff,#fff);mask-image:linear-gradient(#fff,#fff)}
.art:after{box-shadow:none}
.grid{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#ffffff30 transparent;padding:1.4cqw 1.5cqw 2.4cqw;margin: -1.4cqw -1.5cqw -2.4cqw;scroll-behavior:smooth}
.grid::-webkit-scrollbar{width:3px}.grid::-webkit-scrollbar-thumb{background:#ffffff30;border-radius:3px}
.utility-art{background:linear-gradient(145deg,var(--surface-a),var(--surface-b));box-shadow:inset 0 1px 1px #ffffff65,0 .8cqw 1.6cqw #0004;isolation:isolate}
.icon-light{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 23% 0,#ffffff26,transparent 62%);pointer-events:none}
.sculpted-mark{position:relative;width:53%;height:84%;overflow:visible;transform:translateZ(8px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.mark-depth{transform:translateY(1px);filter:brightness(.85);opacity:.35}
.mark-face{filter:drop-shadow(0 2px 2px #00000023)}
.app.active .sculpted-mark{transform:translateY(-1.5%) translateZ(14px) scale(1.035)}
.icon-sheet{aspect-ratio:auto;min-height:100cqw}
.icon-sheet .header,.icon-sheet .home{display:none}
.icon-sheet .grid{position:relative;inset:auto;display:grid;overflow:visible;margin:0;padding:5.5cqw 7cqw;gap:3.5cqw 3cqw}
.choices{grid-template-columns:repeat(4,minmax(0,1fr))}
.pill{position:relative;isolation:isolate;background:linear-gradient(145deg,#ffffff18,#ffffff06 60%,#ffffff10);backdrop-filter:blur(22px) saturate(155%);-webkit-backdrop-filter:blur(22px) saturate(155%);box-shadow:inset 0 1px 1px #ffffff45,inset 0 -1px 1px #ffffff10,0 .5cqw 1.4cqw #0004;transition:background .22s,box-shadow .22s,transform .22s}
.pill:hover,.pill:focus-visible,.pill[aria-expanded=true]{outline:none;color:#fff;background:linear-gradient(135deg,#ffffff38,#ffffff12 48%,#ffffff23);box-shadow:inset 0 1px 1px #ffffff9c,inset 1px 0 1px #ffffff38,inset 0 -1px 1px #ffffff26,0 .65cqw 1.6cqw #0005,0 0 1cqw #ffffff08;transform:scale(1.055)}
.overlay{background:#0002;backdrop-filter:none;-webkit-backdrop-filter:none}
.menu{background:linear-gradient(145deg,#43465473,#181a245e);backdrop-filter:blur(30px) saturate(155%);-webkit-backdrop-filter:blur(30px) saturate(155%);border-color:#ffffff24;box-shadow:inset 0 1px 1px #ffffff50,inset 0 -1px 1px #ffffff0d,0 2cqw 5cqw #0006}
.menu h2{color:#ffffffbd;text-shadow:0 1px 4px #0007}
.menu button{position:relative;isolation:isolate;color:#f8f8fc;text-shadow:0 1px 4px #0008;transition:background .2s,box-shadow .2s,transform .2s}
.menu button small{color:#ffffffb5}
.menu button:hover,.menu button:focus{background:linear-gradient(125deg,#ffffff30,#ffffff10 55%,#ffffff21);color:#fff;outline:none;box-shadow:inset 0 1px 1px #ffffff83,inset 1px 0 1px #ffffff30,inset 0 -1px 1px #ffffff1c,0 .35cqw .9cqw #0003;transform:scale(1.012)}
.menu button:focus small,.menu button:hover small{color:#ffffffe0}
.panel .back{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 1px #ffffff40}
.panel .back:hover,.panel .back:focus-visible{outline:none;background:linear-gradient(135deg,#ffffff32,#ffffff13);box-shadow:inset 0 1px 1px #ffffff90,0 .4cqw 1cqw #0003}
</style>
<main id="tv" class="stage" aria-label="静境 TV 本地设计预览">
<div class="wallpaper"></div><div class="ambient"></div><div class="shade"></div>
<header class="header"><div><div class="clock">21:48</div><div class="date">10月20日 星期二</div></div><nav class="top-actions" aria-label="电视控制"><button class="pill" data-open="inputs">HDMI 1 · Apple TV</button><button class="pill icon-only" data-open="network" aria-label="网络"><svg class="symbol" viewBox="0 0 24 24"><path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r=".5"/></svg></button><button class="pill icon-only" data-open="settings" aria-label="设置"><svg class="symbol" viewBox="0 0 24 24"><g transform="scale(.2)"><path d="M50.941 26.193 L53.922 25.532 L54.016 17.418 L65.984 17.418 L66.078 25.532 L69.059 26.193 L69.059 26.193 L71.971 27.111 L76.108 20.131 L86.473 26.116 L82.498 33.188 L84.749 35.251 L84.749 35.251 L86.812 37.502 L93.884 33.527 L99.869 43.892 L92.889 48.029 L93.807 50.941 L93.807 50.941 L94.468 53.922 L102.582 54.016 L102.582 65.984 L94.468 66.078 L93.807 69.059 L93.807 69.059 L92.889 71.971 L99.869 76.108 L93.884 86.473 L86.812 82.498 L84.749 84.749 L84.749 84.749 L82.498 86.812 L86.473 93.884 L76.108 99.869 L71.971 92.889 L69.059 93.807 L69.059 93.807 L66.078 94.468 L65.984 102.582 L54.016 102.582 L53.922 94.468 L50.941 93.807 L50.941 93.807 L48.029 92.889 L43.892 99.869 L33.527 93.884 L37.502 86.812 L35.251 84.749 L35.251 84.749 L33.188 82.498 L26.116 86.473 L20.131 76.108 L27.111 71.971 L26.193 69.059 L26.193 69.059 L25.532 66.078 L17.418 65.984 L17.418 54.016 L25.532 53.922 L26.193 50.941 L26.193 50.941 L27.111 48.029 L20.131 43.892 L26.116 33.527 L33.188 37.502 L35.251 35.251 L35.251 35.251 L37.502 33.188 L33.527 26.116 L43.892 20.131 L48.029 27.111 L50.941 26.193 Z M60 40 A20 20 0 1 0 60 80 A20 20 0 1 0 60 40 Z" fill="currentColor" fill-rule="evenodd" stroke="none"/></g></svg></button></nav></header>
<section class="home" aria-label="常用应用"></section><section class="grid" aria-label="全部应用"></section>
<div class="overlay" aria-label="控制面板"></div><div class="toast" role="status"></div><div class="safe-lines"></div>
</main>
<aside class="preview-note"><span>本地设计预览 · 方向键切换，↓ 展开应用，Enter 选择，Esc 返回。设备状态为演示数据。首页四图标沿用样稿，其余入口为独立矢量设计稿。<a href="?sheet=1" style="color:#c5d2ff">查看整套图标</a></span><button id="safe">显示安全边距</button></aside>
<script src="catalog.js"></script>
<script>
const tv=document.getElementById('tv'),home=tv.querySelector('.home'),grid=tv.querySelector('.grid'),overlay=tv.querySelector('.overlay');
const icons=[{name:'哔哩哔哩',x:142,y:577,w:344,h:213,tone:'244,63,139'},{name:'腾讯视频',x:523,y:589,w:298,h:189,tone:'31,158,244'},{name:'芒果TV',x:869,y:589,w:302,h:189,tone:'255,130,29'},{name:'爱奇艺',x:1220,y:589,w:307,h:189,tone:'13,201,84'}];
const wallpapers=[{name:'主题色光晕',id:'glow',background:'radial-gradient(ellipse at 50% 42%,#141c48,transparent 58%),#020205'},{name:'流光丝绸',id:'silk',background:'url(../assets/wallpapers/mac-silk.jpg)'},{name:'暮色海岸',id:'coast',background:'url(../assets/wallpapers/mac-coast.jpg)'},{name:'山湖暮色',id:'lake',background:'url(../assets/wallpapers/mountain-lake.png)'}];
let selected=0,gridSelected=0,expanded=false,activePanel='',lastTrigger=null,toastTimer,wall='glow';
function card(a,index,utility=false){const b=document.createElement('button');b.className='app';b.setAttribute('aria-label',a.name);b.dataset.index=index;b.style.setProperty('--glow',`rgba(${a.tone||'90,100,180'},.22)`);
if(!utility){
// Sample artwork includes its own rim and black corner pixels. Sample inside that
// rim, then let one proportional browser mask own the silhouette in both layouts.
const inset=4,w=a.w-inset*2,h=a.h-inset*2;
b.innerHTML=`<div class="art"><div class="crop"><img src="../assets/icons/brand-study.png" alt="" draggable="false" style="width:${1672/w*100}%;height:${941/h*100}%;left:${-(a.x+inset)/w*100}%;top:${-(a.y+inset)/h*100}%"></div></div><span class="name">${a.name}</span>`;
}
else b.innerHTML=catalogArtwork(a)+`<span class="name">${a.name}</span>`;
b.addEventListener('focus',()=>{for(const el of tv.querySelectorAll('.app'))el.classList.toggle('active',el===b);if(b.parentElement===home)selected=index;else gridSelected=index;tv.style.setProperty('--tone',a.tone);if(b.parentElement===grid){const box=b.getBoundingClientRect(),viewport=grid.getBoundingClientRect(),safe=tv.clientWidth*.016;if(box.top<viewport.top+safe)grid.scrollTop+=box.top-viewport.top-safe;else if(box.bottom>viewport.bottom-safe)grid.scrollTop+=box.bottom-viewport.bottom+safe}});
b.addEventListener('pointerenter',()=>{if(!activePanel)b.focus({preventScroll:true})});b.addEventListener('pointermove',e=>{if(!b.classList.contains('active'))return;const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;b.querySelector('.art').style.transform=`translateY(-.7cqw) scale(1.09) rotateX(${-y*5}deg) rotateY(${x*6}deg)`});b.addEventListener('pointerleave',()=>b.querySelector('.art').style.transform='');b.addEventListener('click',()=>a.action?openPanel(a.action,b):toast(`预览：打开${a.name}`));return b}
icons.forEach((a,i)=>{home.append(card(a,i));grid.append(card(a,i))});
TV_CATALOG.forEach((a,i)=>grid.append(card(a,i+4,true)));
function toast(s){const t=tv.querySelector('.toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}
function setWall(id){wall=id;const a=wallpapers.find(a=>a.id===id)||wallpapers[0];wall=a.id;tv.querySelector('.wallpaper').style.background=a.background;tv.querySelector('.wallpaper').style.backgroundSize='cover';tv.querySelector('.wallpaper').style.backgroundPosition='center';tv.querySelector('.ambient').style.opacity=id==='glow'?1:.25;try{localStorage.setItem('quiet-design-wallpaper',id)}catch(e){}}
function closePanel(){overlay.classList.remove('open');overlay.innerHTML='';activePanel='';tv.querySelectorAll('[data-open]').forEach(b=>b.setAttribute('aria-expanded','false'));if(lastTrigger)lastTrigger.focus({preventScroll:true})}
function openPanel(type,trigger){activePanel=type;if(trigger)lastTrigger=trigger;tv.querySelectorAll('[data-open]').forEach(b=>b.setAttribute('aria-expanded',String(b===lastTrigger)));overlay.classList.add('open');let title='',rows=[];
if(type==='settings'){title='设置';rows=[['壁纸与外观','',()=>openPanel('wallpaper')],['应用布局','四个常用应用',()=>{closePanel();setExpanded(true)}],['声音','系统控制',()=>toast('预览：打开电视声音设置')],['电视系统设置','',()=>toast('预览：打开系统设置')]]}
if(type==='inputs'){title='信号源';rows=[['HDMI 1','Apple TV',()=>{toast('预览：切换 HDMI 1 · Apple TV');closePanel()}],['HDMI 2','未连接',()=>toast('演示端口：未连接')],['HDMI 3','未连接',()=>toast('演示端口：未连接')],['AV','未连接',()=>toast('演示端口：未连接')]]}
if(type==='network'){title='网络';rows=[['RT-AX86U','已连接 · 演示',()=>{}],['网络设置','',()=>toast('预览：打开网络设置')]]}
if(type==='wallpaper'){overlay.innerHTML='<section class="panel" role="dialog" aria-label="壁纸与外观"><h2>壁纸与外观</h2><button class="back">返回</button><div class="choices"></div></section>';overlay.querySelector('.back').onclick=()=>openPanel('settings');const choices=overlay.querySelector('.choices');wallpapers.forEach(a=>{const b=document.createElement('button');b.className='wall-choice';b.setAttribute('aria-pressed',wall===a.id);b.innerHTML=`<span class="thumb" style="background-image:${a.id==='glow'?'radial-gradient(ellipse at center,#28366d,#020205)':a.background}"></span>${a.name}`;b.onclick=()=>{setWall(a.id);for(const el of choices.children)el.setAttribute('aria-pressed',el===b)};choices.append(b)});choices.querySelector('[aria-pressed=true]').focus();return}
overlay.innerHTML=`<section class="menu" role="dialog" aria-label="${title}"><h2>${title}</h2></section>`;const menu=overlay.firstElementChild;rows.forEach(([name,detail,action])=>{const b=document.createElement('button');b.innerHTML=`<span>${name}</span><small>${detail}</small>`;b.onclick=action;menu.append(b)});menu.querySelector('button').focus()}
tv.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPanel(b.dataset.open,b));overlay.addEventListener('click',e=>{if(e.target===overlay)closePanel()});
function setExpanded(value){expanded=value;tv.classList.toggle('expanded',value);const list=(value?grid:home).querySelectorAll('.app');list[Math.min(value?gridSelected:selected,list.length-1)].focus({preventScroll:true})}
document.addEventListener('keydown',e=>{const key=e.key;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Escape','Backspace'].includes(key))return;e.preventDefault();if(key==='Escape'||key==='Backspace'){if(activePanel){if(activePanel==='wallpaper')openPanel('settings');else closePanel()}else if(expanded)setExpanded(false);else home.children[selected].focus();return}
if(activePanel){const list=[...overlay.querySelectorAll('button')],at=list.indexOf(document.activeElement);list[Math.max(0,Math.min(list.length-1,at+(['ArrowDown','ArrowRight'].includes(key)?1:-1)))].focus();return}
const top=[...tv.querySelectorAll('[data-open]')];if(top.includes(document.activeElement)){const at=top.indexOf(document.activeElement);if(key==='ArrowDown')(expanded?grid:home).children[selected].focus();else if(key==='ArrowLeft'||key==='ArrowRight')top[Math.max(0,Math.min(2,at+(key==='ArrowRight'?1:-1)))].focus();return}
const list=[...(expanded?grid:home).children];let at=list.indexOf(document.activeElement);if(at<0)at=selected;if(key==='ArrowDown'){if(!expanded)setExpanded(true);else list[Math.min(list.length-1,at+4)].focus()}else if(key==='ArrowUp'){if(expanded&&at>=4)list[at-4].focus();else if(expanded)setExpanded(false);else top[2].focus()}else{let next=at+(key==='ArrowRight'?1:-1);if(next>=0&&next<list.length&&Math.floor(next/4)===Math.floor(at/4))list[next].focus()}});
document.getElementById('safe').onclick=()=>{tv.classList.toggle('show-safe');document.getElementById('safe').textContent=tv.classList.contains('show-safe')?'隐藏安全边距':'显示安全边距'};
try{setWall(localStorage.getItem('quiet-design-wallpaper')||'glow')}catch(e){setWall('glow')}home.children[0].focus({preventScroll:true});
if(new URLSearchParams(location.search).has('sheet')){tv.classList.add('icon-sheet');expanded=true;}
</script>
</html>
